      - GalleryMyApproval:
          Control: Gallery
          Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =538
            Items: |-
              =Filter(
                  If(
                      SelectedEquipment = "Not-Verify",// Memeriksa tab yang dipilih
                      Sort(Filter(
                          'WEC STD-04 Certification',
                          'Verification MSV' = "Not-Verify"  && 'MSV Email' = User().Email // Filter untuk data yang belum diverifikasi
                      ), ID, SortOrder.Descending),
                      If(
                          SelectedEquipment = "Verify",// Jika tab "Verify" dipilih
                          Sort(Filter(
                              'WEC STD-04 Certification',
                              'Verification MSV' = "Verify"  && 'MSV Email' = User().Email// Filter untuk data yang sudah diverifikasi
                          ), ID, SortOrder.Descending),
                          Blank()// Kosongkan jika tab tidak dipilih
                      )
                  ),
                  Or(
                      StartsWith(ID, SearchData.Text),
                      StartsWith('Inspector Name', SearchData.Text),
                      StartsWith('PRV Tag Number', SearchData.Text),
