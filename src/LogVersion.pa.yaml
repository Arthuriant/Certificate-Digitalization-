              =If(
                  imyrole.Value = "Admin",
                  Navigate(Dashboard),
                  Notify("You do not have permission to sign in.", NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 10, 70, 1)
