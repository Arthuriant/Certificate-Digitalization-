      - GallerySTD04:
          Control: Gallery
          Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DelayItemLoading: =false
            Height: =538
            Items: |-
              =Sort(Filter(
                  If(
                      SelectedEquipment = "All Record",
                      'WEC STD-04 Certification',// Tampilkan semua data jika "All Record" dipilih
                      Sort(Filter(
                          'WEC STD-04 Certification',
                          'Tested Equipment' = SelectedEquipment
                      ), ID, SortOrder.Descending)
                  ),
                  /*
                      Sort(Filter(
                          'WEC STD-04 Certification',
                          'Tested Equipment' = SelectedEquipment
                      ), ID, SortOrder.Descending),
                  */
                  Or(
                      StartsWith(
                          'FA / Serial Number',
                          SearchbarSTD04.Text
                      ),
                      StartsWith(
                          'Inspector Name',
                          SearchbarSTD04.Text
                      ),
                      StartsWith(
                          'Unit Description',
                          SearchbarSTD04.Text
                      ),
                      StartsWith(
                          'Pressure Gauge Tag Number',
                          SearchbarSTD04.Text
                      ),
                      StartsWith(
                          'PRV Tag Number',
                          SearchbarSTD04.Text
                      ),
                      StartsWith(
                          'BT_Label on Body',
                          SearchbarSTD04.Text
                      ),
                      StartsWith(
                          ID,
                          SearchbarSTD04.Text
                      )
                      //StartsWith(ID, SearchIDSTD04.Text)
                  )
              ), ID, SortOrder.Descending)
            TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 238, 252, 1), RGBA(255, 255, 255, 1))
            TemplateSize: =48
            Width: =1118
            X: =224
            Y: =200
